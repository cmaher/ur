syntax = "proto3";
package ur.builder_container;

service BuilderContainerService {
  // Launch a worker container with the given spec. Stats each volume source on
  // the host before calling docker run; returns FailedPrecondition if any
  // source is missing.
  rpc LaunchWorker(LaunchWorkerRequest) returns (LaunchWorkerResponse);

  // Stop and remove every container this instance runs for a worker id (by
  // label). A barrier per worker id: waits for an in-flight LaunchWorker of
  // it and refuses any later one. Ok means nothing with this worker id runs
  // in this builderd, now or later (no container is Ok).
  rpc StopWorker(StopWorkerRequest) returns (StopWorkerResponse);

  // Every worker container this ur instance runs (by label), running or not.
  rpc ListWorkerContainers(ListWorkerContainersRequest) returns (ListWorkerContainersResponse);

  // Execute a command inside a running container and return its output.
  // Used for squid reconfigure and similar one-shot exec operations.
  rpc ExecContainer(ExecContainerRequest) returns (ExecContainerResponse);

  // Inspect whether a Docker network exists.
  rpc InspectNetwork(InspectNetworkRequest) returns (InspectNetworkResponse);

}

message Volume {
  string host_path = 1;
  string container_path = 2;
}

message PortMap {
  uint32 host_port = 1;
  uint32 container_port = 2;
}

message EnvVar {
  string key = 1;
  string value = 2;
}

message AddHost {
  string host = 1;
  string ip = 2;
}

message LaunchWorkerRequest {
  string image = 1;
  // Container name (Docker DNS name): the server's worker prefix plus
  // `worker_id`. builderd identifies the container by its labels only.
  string name = 2;
  uint32 cpus = 3;
  string memory = 4;
  repeated Volume volumes = 5;
  repeated PortMap port_maps = 6;
  repeated EnvVar env_vars = 7;
  string workdir = 8;
  string network = 9;
  repeated AddHost add_hosts = 10;
  // Required. The container is labeled `ur.worker_id=<worker_id>` and
  // `ur.instance=<this builderd's instance>`. builderd orders LaunchWorker
  // and StopWorker per worker id: a StopWorker for it refuses a later launch.
  string worker_id = 11;
}

message LaunchWorkerResponse {}

message StopWorkerRequest {
  reserved 1;
  string worker_id = 2;
  // Upgrade only: the Docker ID of a container launched before containers
  // were labeled (ur-ezhdb). Stopped too, but only if its UR_WORKER_ID env
  // is `worker_id`. Empty for every container launched since.
  string legacy_container_id = 3;
}

message StopWorkerResponse {}

message ExecContainerRequest {
  string container_id = 1;
  string command = 2;
  repeated string args = 3;
  string workdir = 4;
}

message ExecContainerResponse {
  int32 exit_code = 1;
  string stdout = 2;
  string stderr = 3;
}

message InspectNetworkRequest {
  string name = 1;
}

message InspectNetworkResponse {
  bool exists = 1;
}

message ListWorkerContainersRequest {}

message ListWorkerContainersResponse {
  repeated WorkerContainerStatus containers = 1;
}

message WorkerContainerStatus {
  string worker_id = 1;
  bool running = 2;
}
