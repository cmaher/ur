syntax = "proto3";
package ur.workerd;

import "core.proto";

service WorkerDaemonService {
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc NotifyIdle(NotifyIdleRequest) returns (NotifyIdleResponse);
  rpc Implement(ImplementRequest) returns (ImplementResponse);
  rpc Design(DesignRequest) returns (DesignResponse);
  rpc AddressFeedbackTickets(AddressFeedbackRequest) returns (AddressFeedbackResponse);
  rpc StepComplete(StepCompleteRequest) returns (StepCompleteResponse);
  rpc PauseNudge(PauseNudgeRequest) returns (PauseNudgeResponse);
  rpc SetTicket(SetTicketRequest) returns (SetTicketResponse);
  rpc DispatchTicket(DispatchTicketRequest) returns (DispatchTicketResponse);
  rpc SetStatusLeft(SetStatusLeftRequest) returns (SetStatusLeftResponse);
  // Session control, reached through the server's CoreService.
  rpc CapturePane(CapturePaneRequest) returns (CapturePaneResponse);
  rpc ReadTranscript(ReadTranscriptRequest) returns (ReadTranscriptResponse);
  rpc SendKeys(SendKeysRequest) returns (SendKeysResponse);
  rpc Interrupt(InterruptRequest) returns (InterruptResponse);
  rpc WaitIdle(WaitIdleRequest) returns (WaitIdleResponse);
}

message SendMessageRequest {
  string message = 1;
  // When true or unset, workerd appends an Enter keypress after the literal
  // text via tmux send-keys. Set to false to send text without submitting.
  // Declared `optional` so an unset field is distinguishable from an explicit
  // false — a plain proto3 bool would default to false and silently mean
  // "do not submit".
  optional bool submit = 3;
}

message SendMessageResponse {
  bool success = 1;
  string error = 2;
}

message NotifyIdleRequest {}

message NotifyIdleResponse {}

message ImplementRequest {
  string ticket_id = 1;
}

message ImplementResponse {}

message DesignRequest {
  string ticket_id = 1;
}

message DesignResponse {}

message AddressFeedbackRequest {
  string ticket_id = 1;
  uint32 pr_number = 2;
  // Comment IDs that have already had feedback tickets created in prior runs.
  // The worker should skip these when processing PR comments.
  repeated string handled_comment_ids = 3;
}

message AddressFeedbackResponse {}

message StepCompleteRequest {}

message StepCompleteResponse {}

message PauseNudgeRequest {}

message PauseNudgeResponse {}

message SetTicketRequest {
  string ticket_id = 1;
}

message SetTicketResponse {}

message DispatchTicketRequest {}

message DispatchTicketResponse {
  string error = 1;
}

message SetStatusLeftRequest {
  string status_left = 1;
  // When 0, the status-left-length is left unchanged.
  uint32 status_left_length = 2;
}

message SetStatusLeftResponse {
  bool success = 1;
  string error = 2;
}

message CapturePaneRequest {
  // Scrollback lines above the visible screen (0 = screen only).
  uint32 lines = 1;
}

message CapturePaneResponse {
  string text = 1;
}

message ReadTranscriptRequest {
  // Most recent turns to return (callers pass a non-zero value).
  uint32 turns = 1;
}

message ReadTranscriptResponse {
  repeated ur.core.TranscriptTurn turns = 1;
  string source_path = 2;
}

message SendKeysRequest {
  repeated ur.core.WorkerKey keys = 1;
}

message SendKeysResponse {}

message InterruptRequest {}

message InterruptResponse {}

message WaitIdleRequest {
  uint32 timeout_secs = 1;
  uint32 screen_lines = 2;
}

message WaitIdleResponse {
  bool timed_out = 1;
  string screen_tail = 2;
}
