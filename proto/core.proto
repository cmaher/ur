syntax = "proto3";

package ur.core;

// Shared streaming message for CLI proxy services
message CommandOutput {
  oneof payload {
    bytes stdout = 1;
    bytes stderr = 2;
    int32 exit_code = 3;
    // Sent when a long-lived process is already running (e.g. reconnecting to
    // an existing daemon). The bool value is always true when present.
    bool already_running = 4;
  }
}

// Core always-on service
service CoreService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc WorkerLaunch(WorkerLaunchRequest) returns (WorkerLaunchResponse);
  rpc WorkerStop(WorkerStopRequest) returns (WorkerStopResponse);
  rpc WorkerInfo(WorkerInfoRequest) returns (WorkerInfoResponse);
  rpc WorkerList(WorkerListRequest) returns (WorkerListResponse);
  rpc SendWorkerMessage(SendWorkerMessageRequest) returns (SendWorkerMessageResponse);
  rpc UpdateAgentStatus(UpdateAgentStatusRequest) returns (UpdateAgentStatusResponse);
  // Signal that a workflow step has completed for the given worker.
  rpc WorkflowStepComplete(WorkflowStepCompleteRequest) returns (WorkflowStepCompleteResponse);
  // Link a PR comment to a feedback ticket for reply tracking.
  rpc LinkCommentTicket(LinkCommentTicketRequest) returns (LinkCommentTicketResponse);
  // Hot-reload projects from ur.toml without restarting the server.
  rpc ReloadProjects(ReloadProjectsRequest) returns (ReloadProjectsResponse);
  // Session control (host-facing only; the worker-facing server answers
  // Unimplemented). Each routes to the worker's daemon like SendWorkerMessage.
  // Rendered pane text of the worker's agent, with scrollback.
  rpc CaptureWorkerPane(CaptureWorkerPaneRequest) returns (CaptureWorkerPaneResponse);
  // Last turns parsed from the agent's own session log.
  rpc ReadWorkerTranscript(ReadWorkerTranscriptRequest) returns (ReadWorkerTranscriptResponse);
  // Press allowlisted named keys in the worker's agent pane.
  rpc SendWorkerKeys(SendWorkerKeysRequest) returns (SendWorkerKeysResponse);
  // Interrupt the agent's current turn with its agent-specific key.
  rpc InterruptWorker(InterruptWorkerRequest) returns (InterruptWorkerResponse);
  // Block until the agent finishes its turn (Stop hook), or time out.
  rpc WaitWorkerIdle(WaitWorkerIdleRequest) returns (WaitWorkerIdleResponse);
}

message PingRequest {}
message PingResponse {
  string message = 1;
}

message WorkerLaunchRequest {
  string worker_id = 1;
  string image_id = 2;
  uint32 cpus = 3;
  string memory = 4;
  string workspace_dir = 5;
  // Formerly a credentials JSON blob field, dead on the wire (credentials
  // travel by bind mount, not RPC). Reserved so an old client's credential
  // string can never be silently decoded as an agent name.
  reserved 6;
  // Skills mode to use for the worker.
  string mode = 7;
  // Skills to install in the worker container.
  repeated string skills = 8;
  // Project key for repo pool launches (empty for raw workspace mounts).
  string project_key = 9;
  // Project keys to mount as read-only context repositories.
  repeated string context_repos = 10;
  // Whether the server should auto-dispatch commands to the worker after launch.
  bool dispatch = 11;
  // Which agent should run the worker. Empty defaults to claude server-side.
  string agent_type = 12;
  // Worker runtime ("container" | "local"). Empty resolves from config:
  // worker_modes.<mode>.runtime → projects.<key>.runtime → top-level runtime → container.
  string runtime = 13;
}

message WorkerLaunchResponse {
  string container_id = 1;
  string process_id = 2;
}

message WorkerStopRequest {
  string worker_id = 1;
}

message WorkerStopResponse {}

message WorkerInfoRequest {
  string worker_id = 1;
}

message WorkerInfoResponse {
  string workspace_dir = 1;
  string agent_status = 2;
  // Worker runtime ("container" | "local").
  string runtime = 3;
}

message WorkerListRequest {}

message WorkerListResponse {
  repeated WorkerSummary workers = 1;
}

message SendWorkerMessageRequest {
  string worker_id = 1;
  string message = 2;
  // When true or unset, workerd appends an Enter keypress after the literal
  // text via tmux send-keys. Set to false to send text without submitting.
  // Declared `optional` so an unset field is distinguishable from an explicit
  // false — a plain proto3 bool would default to false and silently mean
  // "do not submit".
  optional bool submit = 3;
}

message SendWorkerMessageResponse {
  bool success = 1;
  string error = 2;
}

message CaptureWorkerPaneRequest {
  string worker_id = 1;
  // Scrollback lines above the visible screen to include (0 = screen only).
  uint32 lines = 2;
}

message CaptureWorkerPaneResponse {
  string text = 1;
}

message ReadWorkerTranscriptRequest {
  string worker_id = 1;
  // Number of most recent turns to return; 0 means the server default.
  uint32 turns = 2;
}

// One tool invocation inside a transcript turn.
message TranscriptToolCall {
  string name = 1;
  // Short one-line summary of the call's input (command, path, ...).
  string summary = 2;
}

// One turn of an agent conversation, normalized across agent types.
// Consecutive log entries from the same role merge into one turn; tool
// results do not end an assistant turn.
message TranscriptTurn {
  // "user" or "assistant".
  string role = 1;
  string text = 2;
  repeated TranscriptToolCall tool_calls = 3;
}

message ReadWorkerTranscriptResponse {
  repeated TranscriptTurn turns = 1;
  // Path of the session log the turns were read from (inside the worker).
  string source_path = 2;
}

// Keys a caller may press in a worker's agent pane. An allowlist: raw tmux
// key strings are never accepted.
enum WorkerKey {
  WORKER_KEY_UNSPECIFIED = 0;
  WORKER_KEY_ESCAPE = 1;
  WORKER_KEY_CTRL_C = 2;
  WORKER_KEY_ENTER = 3;
  WORKER_KEY_UP = 4;
  WORKER_KEY_DOWN = 5;
  WORKER_KEY_LEFT = 6;
  WORKER_KEY_RIGHT = 7;
  WORKER_KEY_TAB = 8;
  WORKER_KEY_DIGIT_0 = 10;
  WORKER_KEY_DIGIT_1 = 11;
  WORKER_KEY_DIGIT_2 = 12;
  WORKER_KEY_DIGIT_3 = 13;
  WORKER_KEY_DIGIT_4 = 14;
  WORKER_KEY_DIGIT_5 = 15;
  WORKER_KEY_DIGIT_6 = 16;
  WORKER_KEY_DIGIT_7 = 17;
  WORKER_KEY_DIGIT_8 = 18;
  WORKER_KEY_DIGIT_9 = 19;
}

message SendWorkerKeysRequest {
  string worker_id = 1;
  repeated WorkerKey keys = 2;
}

message SendWorkerKeysResponse {}

message InterruptWorkerRequest {
  string worker_id = 1;
}

message InterruptWorkerResponse {}

message WaitWorkerIdleRequest {
  string worker_id = 1;
  // Seconds to wait before giving up; 0 means the server default.
  uint32 timeout_secs = 2;
  // Screen lines to return when the wait times out; 0 means the default.
  uint32 screen_lines = 3;
}

message WaitWorkerIdleResponse {
  // True when the agent did not go idle in time. The wait is not an error at
  // the RPC level so the screen tail reaches the caller.
  bool timed_out = 1;
  // Last screen lines of the agent pane, set only when timed_out.
  string screen_tail = 2;
}

message UpdateAgentStatusRequest {
  string worker_id = 1;
  string status = 2;
  // Optional human-readable message (used by request-human to surface to the user).
  string message = 3;
}

message UpdateAgentStatusResponse {}

message WorkerSummary {
  string worker_id = 1;
  string worker_id_full = 2;
  string container_id = 3;
  string project_key = 4;
  string mode = 5;
  uint32 grpc_port = 6;
  string directory = 7;
  string container_status = 8;
  string agent_status = 9;
  string lifecycle_status = 10;
  string stall_reason = 11;
  string pr_url = 12;
  string workflow_id = 13;
  string workflow_status = 14;
  bool workflow_stalled = 15;
  string workflow_stall_reason = 16;
  // Which agent is running this worker (e.g. "claude").
  string agent_type = 17;
  // Worker runtime ("container" | "local").
  string runtime = 18;
}

message WorkflowStepCompleteRequest {
  string worker_id = 1;
}

message WorkflowStepCompleteResponse {}

message LinkCommentTicketRequest {
  string worker_id = 1;
  int64 pr_number = 2;
  int64 comment_id = 3;
  string ticket_id = 4;
}

message LinkCommentTicketResponse {}

message ReloadProjectsRequest {
  // Authoritative ur.toml contents the caller just wrote. When non-empty,
  // the server parses these bytes directly instead of re-reading the file
  // from its bind-mounted view, sidestepping macOS Docker Desktop bind-mount
  // propagation lag. Empty means "read the file" (legacy behavior).
  string config_toml = 1;
}

message ReloadProjectsResponse {
  repeated string added = 1;
  repeated string removed = 2;
}

