# Keep tasks small and composable. Inline scripts go in scripts/build/.

[config]
default_to_workspace = false

[tasks.fmt]
description = "Auto-fix formatting, then fail if changes were needed"
script_runner = "@shell"
script = ["""
if ! cargo fmt --all --check >/dev/null 2>&1; then
    cargo fmt --all >/dev/null 2>&1
    echo "error: formatting was incorrect. Files are already fixed on disk. Stage, commit, and push again."
    exit 1
fi
"""]

[tasks.fmt-fix]
description = "Fix code formatting"
command = "cargo"
args = ["fmt", "--all"]

[tasks.clippy]
description = "Run clippy lints on all workspace crates"
command = "cargo"
args = ["clippy", "--locked", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]

# Same features and targets as `test`, so `test` reuses every artifact instead
# of compiling the workspace a second time. --all-targets builds test harnesses
# too (activating dev-dependency features); `ur`/`builderd` binaries in
# target/debug are what the acceptance suite runs.
[tasks.build]
description = "Build all workspace crates and test targets"
command = "cargo"
args = ["build", "--workspace", "--all-targets"]

[tasks.test]
description = "Run tests on all workspace crates"
dependencies = ["test:init"]
command = "cargo"
args = ["test", "--workspace"]

[tasks.audit]
description = "Run cargo audit for dependency vulnerabilities"
command = "cargo"
args = ["audit"]

[tasks.stage]
description = "Build image binaries (ur-server, workerd, workertools) in one cross-compile and stage them into the container build contexts"
script_runner = "@shell"
script = ["scripts/build/stage.sh"]

[tasks.stage-native]
description = "Same as stage but with a native (non-zig) build (Linux hosts only)"
env = { "UR_NATIVE_BUILD" = "1" }
script_runner = "@shell"
script = ["scripts/build/stage.sh"]

[tasks.image]
description = "Build all container images (worker + server)"
dependencies = ["stage"]
script_runner = "@shell"
script = ["scripts/build/image.sh"]

[tasks.image-native]
description = "Build all container images using native compilation (for Linux CI)"
dependencies = ["stage-native"]
script_runner = "@shell"
script = ["scripts/build/image.sh"]

[tasks.install]
description = "Build ur CLI + builderd, install to UR_INSTALL_DIR (default ~/.local/bin), and build all container images"
dependencies = ["image"]
script_runner = "@shell"
script = ["scripts/build/install.sh"]

[tasks.tools]
description = "Build and install tool binaries (tk-import, tk-verify) to UR_INSTALL_DIR (default ~/.local/bin)"
script_runner = "@shell"
script = ["scripts/build/install-tools.sh"]

[tasks.install-nocache]
description = "Same as install but force-rebuilds the base image (no Docker cache)"
dependencies = ["image-force-base"]
script_runner = "@shell"
script = ["scripts/build/install.sh"]

[tasks.image-update-claude]
description = "Build all container images, forcing a Claude Code update in the worker image (keeps the base image cache)"
dependencies = ["stage"]
env = { "UR_UPDATE_AGENT" = "claude" }
script_runner = "@shell"
script = ["scripts/build/image.sh"]

[tasks.install-update-claude]
description = "Same as install but forces a Claude Code update in the worker image (no base rebuild)"
dependencies = ["image-update-claude"]
script_runner = "@shell"
script = ["scripts/build/install.sh"]

[tasks.image-update-codex]
description = "Build all container images, forcing a codex update in the worker image (keeps the base image cache)"
dependencies = ["stage"]
env = { "UR_UPDATE_AGENT" = "codex" }
script_runner = "@shell"
script = ["scripts/build/image.sh"]

[tasks.install-update-codex]
description = "Same as install but forces a codex update in the worker image (no base rebuild)"
dependencies = ["image-update-codex"]
script_runner = "@shell"
script = ["scripts/build/install.sh"]

[tasks.image-update-agy]
description = "Build all container images, forcing an AGY update in the worker image (keeps the base image cache)"
dependencies = ["stage"]
env = { "UR_UPDATE_AGENT" = "agy" }
script_runner = "@shell"
script = ["scripts/build/image.sh"]

[tasks.install-update-agy]
description = "Same as install but forces an AGY update in the worker image (no base rebuild)"
dependencies = ["image-update-agy"]
script_runner = "@shell"
script = ["scripts/build/install.sh"]

[tasks.image-force-base]
description = "Build all container images, force-rebuilding the base image (no Docker cache)"
dependencies = ["stage"]
env = { "UR_FORCE_REBUILD_BASE" = "1" }
script_runner = "@shell"
script = ["scripts/build/image.sh"]

[tasks.install-debug]
description = "Same as install but with debug builds"
dependencies = ["image"]
env = { "UR_BUILD_PROFILE" = "debug" }
script_runner = "@shell"
script = ["scripts/build/install.sh"]

[tasks.acceptance]
description = "Build container images and run acceptance tests"
dependencies = ["image"]
command = "cargo"
args = ["test", "-p", "acceptance", "--features", "acceptance"]

[tasks.acceptance-ci]
description = "Build content-hash-tagged CI images (skipped when already built) and run acceptance tests"
script_runner = "@shell"
script = ["scripts/acceptance-ci.sh"]

[tasks.housekeeping]
description = "Prune stale target/ artifacts (cargo-sweep) and cap Docker's build cache"
script_runner = "@shell"
script = ["scripts/build/housekeeping.sh"]

[tasks.install-hooks]
description = "Install git hooks (pre-commit formats, pre-push runs CI + acceptance)"
script_runner = "@shell"
script = ["cp ur-hooks/git/* .git/hooks/"]

[tasks."test:init"]
description = "Start ci-postgres container for tests (port 5433) if not already up"
script_runner = "@shell"
script = ["""
# Fast path: if something is already listening on :5433, assume ci-postgres is up.
if (exec 3<>/dev/tcp/localhost/5433) 2>/dev/null; then
    exec 3<&- 3>&-
    exit 0
fi
if docker inspect ci-postgres >/dev/null 2>&1; then
    echo "ci-postgres exists but not listening; starting"
    docker start ci-postgres >/dev/null 2>&1 || true
else
    echo "creating ci-postgres"
    docker run -d --name ci-postgres \
        -e POSTGRES_USER=ur \
        -e POSTGRES_PASSWORD=ur \
        -e POSTGRES_DB=postgres \
        -p 5433:5432 \
        --shm-size=512m \
        postgres:17
fi
echo "Waiting for ci-postgres to be ready..."
for i in $(seq 1 30); do
    if docker exec ci-postgres pg_isready -U ur >/dev/null 2>&1; then
        echo "ci-postgres is ready on localhost:5433"
        exit 0
    fi
    sleep 1
done
echo "ci-postgres failed to become ready"
exit 1
"""]

[tasks."test:clean"]
description = "Stop and remove ci-postgres container"
script_runner = "@shell"
script = ["""
docker stop ci-postgres 2>/dev/null || true
docker rm ci-postgres 2>/dev/null || true
echo "ci-postgres removed"
"""]

[tasks.ci]
description = "Run all CI checks"
dependencies = ["fmt", "clippy", "build", "test"]

[tasks.fmt-fix-silent]
description = "Fix code formatting (no output)"
script_runner = "@shell"
script = ["cargo fmt --all >/dev/null 2>&1"]

[tasks.ci-fmt-fix]
description = "Auto-fix formatting silently, then run CI checks (clippy, build, test)"
dependencies = ["fmt-fix-silent", "clippy", "build", "test"]
